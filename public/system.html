<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Live Output</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .detail-wrap {
        width: min(1400px, 96vw);
        margin: 16px auto;
        display: grid;
        gap: 12px;
      }

      .output-box {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #fcfffd;
      }

      pre {
        margin: 0;
        max-height: 45vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.86rem;
      }

      .detail-meta {
        display: grid;
        gap: 6px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="detail-wrap">
      <section class="panel">
        <h2 id="title">System Output</h2>
        <div id="meta" class="detail-meta"></div>
      </section>
      <section class="output-box">
        <h3>PMUtil Output</h3>
        <pre id="pmutil">Waiting for data...</pre>
      </section>
      <section class="output-box">
        <h3>Turbostat Output</h3>
        <pre id="turbostat">Waiting for data...</pre>
      </section>
      <section class="output-box">
        <h3>Loop Summary</h3>
        <div style="overflow:auto;max-height:220px;border:1px solid var(--line);border-radius:8px;">
          <table style="width:100%;border-collapse:collapse;">
            <thead style="position:sticky;top:0;background:#eef4ef;">
              <tr>
                <th style="text-align:left;padding:8px;border-bottom:1px solid #e3ece6;">Loop</th>
                <th style="text-align:left;padding:8px;border-bottom:1px solid #e3ece6;">C6</th>
                <th style="text-align:left;padding:8px;border-bottom:1px solid #e3ece6;">PC6</th>
              </tr>
            </thead>
            <tbody id="loopSummaryBodySystem">
              <tr><td colspan="3" style="padding:8px;color:var(--muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <div style="display:flex;gap:10px;align-items:center;">
          <a id="openLog" href="#" target="_blank" rel="noopener noreferrer">Open Log Text</a>
          <button id="downloadLog" class="btn btn-secondary" type="button">&#8615; Download Log</button>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const title = document.getElementById("title");
      const meta = document.getElementById("meta");
      const pmutil = document.getElementById("pmutil");
      const turbostat = document.getElementById("turbostat");
      const openLog = document.getElementById("openLog");
      const loopSummaryBodySystem = document.getElementById("loopSummaryBodySystem");
      let latestLoop = "-";

      function parseTurboStatBlockForC6Pc6(turbostatOutput) {
        const text = turbostatOutput || "";
        const lines = text
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter(Boolean);

        let c6 = null;
        let pc6 = null;

        for (let i = 0; i < lines.length; i += 1) {
          const header = lines[i];
          if (!header.includes("CPU%c6") || !header.includes("Pkg%pc6")) continue;

          const headers = header.split(/\s+/);
          const cpuC6Idx = headers.indexOf("CPU%c6");
          const pkgPc6Idx = headers.indexOf("Pkg%pc6");
          if (cpuC6Idx < 0 || pkgPc6Idx < 0) continue;

          for (let j = i + 1; j < lines.length; j += 1) {
            const row = lines[j];
            if (row.includes("CPU%c6") && row.includes("Pkg%pc6")) break;
            const cols = row.split(/\s+/);
            if (cols.length <= Math.max(cpuC6Idx, pkgPc6Idx)) continue;

            const cpuVal = Number(cols[cpuC6Idx]);
            const pkgVal = Number(cols[pkgPc6Idx]);
            if (!Number.isNaN(cpuVal)) c6 = cpuVal;
            if (!Number.isNaN(pkgVal)) pc6 = pkgVal;
          }

          if (c6 !== null || pc6 !== null) break;
        }

        if (c6 === null) {
          const c6Match = text.match(/CPU%c6[^0-9]*([0-9]+(?:\.[0-9]+)?)/i);
          c6 = c6Match ? Number(c6Match[1]) : null;
        }
        if (pc6 === null) {
          const pc6Match = text.match(/Pkg%pc6[^0-9]*([0-9]+(?:\.[0-9]+)?)/i);
          pc6 = pc6Match ? Number(pc6Match[1]) : null;
        }

        return { c6, pc6 };
      }

      function parseLoopSummaryFromLog(logText) {
        const text = String(logText || "").replace(/\r\n?/g, "\n");
        const lines = text.split("\n");
        const byLoop = new Map();

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i].trim();
          const headerMatch = line.match(/^\[[^\]]+\]\s+LOOP_(\d+)_TURBOSTAT\s*$/i);
          if (!headerMatch) continue;

          const loopNumber = Number(headerMatch[1]);
          const blockLines = [];
          for (let j = i + 1; j < lines.length; j += 1) {
            const candidate = lines[j].trim();
            if (/^\[[^\]]+\]\s+\S+/.test(candidate)) break;
            blockLines.push(lines[j]);
            i = j;
          }

          const parsed = parseTurboStatBlockForC6Pc6(blockLines.join("\n"));
          byLoop.set(loopNumber, { loop: loopNumber, c6: parsed.c6, pc6: parsed.pc6 });
        }

        return Array.from(byLoop.values()).sort((a, b) => a.loop - b.loop);
      }

      async function refreshLoopSummary() {
        if (!id) return;
        try {
          const res = await fetch(`/api/systems/${id}/log`);
          if (!res.ok) {
            loopSummaryBodySystem.innerHTML = '<tr><td colspan="3" style="padding:8px;color:var(--muted);">Failed to load summary</td></tr>';
            return;
          }
          const logText = await res.text();
          const rows = parseLoopSummaryFromLog(logText);
          if (!rows.length) {
            loopSummaryBodySystem.innerHTML = '<tr><td colspan="3" style="padding:8px;color:var(--muted);">No loop summary found</td></tr>';
            return;
          }
          loopSummaryBodySystem.innerHTML = rows
            .map((r) => `<tr><td style="padding:8px;border-bottom:1px solid #e3ece6;">${r.loop}</td><td style="padding:8px;border-bottom:1px solid #e3ece6;">${r.c6 ?? "-"}</td><td style="padding:8px;border-bottom:1px solid #e3ece6;">${r.pc6 ?? "-"}</td></tr>`)
            .join("");
        } catch (_e) {
          loopSummaryBodySystem.innerHTML = '<tr><td colspan="3" style="padding:8px;color:var(--muted);">Error loading summary</td></tr>';
        }
      }

      function fillMeta(system) {
        title.textContent = `System Output: ${system.systemName} (${system.ip})`;
        meta.innerHTML = "";
        const lines = [
          `Latest saved loop: ${latestLoop}`,
          `Status: ${system.status}`,
          `Loop: ${(system.loopCount ?? 0)}/${(system.targetRuns ?? 0)}`,
          `Sockets: ${system.sockets ?? "-"}`,
          `C6: ${system.c6 ?? "-"}`,
          `PC6: ${system.pc6 ?? "-"}`,
          `Elapsed: ${system.elapsedSec ?? 0}s`,
          `Time Left: ${system.leftSec ?? 0}s`,
          `Log Path: ${system.logPath || "-"}`
        ];
        for (const line of lines) {
          const div = document.createElement("div");
          div.textContent = line;
          meta.appendChild(div);
        }
      }

      async function loadDetails() {
        if (!id) {
          pmutil.textContent = "Missing system id";
          turbostat.textContent = "Missing system id";
          return;
        }

        const res = await fetch(`/api/systems/${id}/details`);
        if (!res.ok) {
          pmutil.textContent = "Unable to load details";
          turbostat.textContent = "Unable to load details";
          return;
        }
        const data = await res.json();
        fillMeta(data);
        pmutil.textContent = data.pmutilOutput || "No PMUtil data yet";
        turbostat.textContent = data.turbostatOutput || "No Turbostat data yet";
        openLog.href = `/api/systems/${id}/log`;
      }

      function connectWs() {
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(`${protocol}://${location.host}`);
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === "systemOutput" && msg.id === id) {
              pmutil.textContent = msg.pmutilOutput || "No PMUtil data yet";
              turbostat.textContent = msg.turbostatOutput || "No Turbostat data yet";
              latestLoop = msg.loopNumber ?? "-";
            }
            if ((msg.type === "systemUpdate" || msg.type === "tick") && msg.system && msg.system.id === id) {
              fillMeta(msg.system);
            }
          } catch (_err) {
            // ignore malformed ws events
          }
        };
      }

      loadDetails();
      connectWs();
      setInterval(loadDetails, 5000);
      refreshLoopSummary();
      setInterval(refreshLoopSummary, 5000);

      document.getElementById("downloadLog").addEventListener("click", async () => {
        if (!id) return;
        try {
          const res = await fetch(`/api/systems/${id}/log`);
          const text = res.ok ? await res.text() : "Failed to load log.";
          const sysTitle = (title.textContent || id).replace(/[^a-zA-Z0-9._-]/g, "_");
          const blob = new Blob([text], { type: "text/plain" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${sysTitle}_log.txt`;
          a.click();
          URL.revokeObjectURL(url);
        } catch (_e) {
          alert("Error downloading log.");
        }
      });
    </script>
  </body>
</html>
